name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 12
          cache: npm
      - run: npm ci
      - name: Provide placeholder secrets for tests
        run: cp src/config/secrets.example.js src/config/secrets.js
      - run: npm run lint
      - run: npm test -- --ci
